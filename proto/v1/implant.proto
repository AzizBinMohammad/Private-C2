syntax = "proto3";

package privatec2.v1;

option go_package = "github.com/azizbinmohammad/private-c2/pkg/proto/v1/implantpb";

import "google/protobuf/timestamp.proto";
import "proto/v1/common.proto";

message Envelope {
  int32 type = 1;
  bytes data = 2;
  string id = 3;
  google.protobuf.Timestamp timestamp = 4;
}

message Register {
  string implant_id = 1;
  string hostname = 2;
  string username = 3;
  string os = 4;
  string arch = 5;
  int32 pid = 6;
  string process_name = 7;
  string domain = 8;
  bool elevated = 9;
  string locale = 10;
  bytes session_key = 11;
}

message Ping {
  int64 nonce = 1;
}

message TaskRequest {
  string id = 1;
  string type = 2;
  bytes data = 3;
  bool async = 4;
  int64 timeout_ms = 5;
}

message TaskResponse {
  string id = 1;
  string type = 2;
  bytes data = 3;
  bool success = 4;
  string error = 5;
  google.protobuf.Timestamp completed_at = 6;
}

message ShellRequest {
  string path = 1;
  repeated string args = 2;
  bool piped = 3;
  int64 timeout_ms = 4;
  string tunnel_id = 5;
}

message ShellResponse {
  bytes stdout = 1;
  bytes stderr = 2;
  int32 exit_code = 3;
}

message FileRequest {
  string path = 1;
  FileOperation operation = 2;
  bytes data = 3;
  bool recursive = 4;
}

enum FileOperation {
  FILE_OP_UNSPECIFIED = 0;
  FILE_OP_READ = 1;
  FILE_OP_WRITE = 2;
  FILE_OP_LIST = 3;
  FILE_OP_DELETE = 4;
  FILE_OP_STAT = 5;
  FILE_OP_MKDIR = 6;
  FILE_OP_DOWNLOAD = 7;
  FILE_OP_UPLOAD = 8;
}

message FileResponse {
  bytes data = 1;
  repeated FileInfo entries = 2;
}

message FileInfo {
  string name = 1;
  string path = 2;
  int64 size = 3;
  bool is_dir = 4;
  string permissions = 5;
  google.protobuf.Timestamp modified_at = 6;
}

message ProcessListRequest {}

message ProcessListResponse {
  repeated ProcessInfo processes = 1;
}

message ProcessInfo {
  int32 pid = 1;
  int32 ppid = 2;
  string name = 3;
  string owner = 4;
  string path = 5;
  string cmdline = 6;
  string arch = 7;
}

message NetworkInfo {
  repeated NetworkInterface interfaces = 1;
  repeated NetworkConnection connections = 2;
}

message NetworkInterface {
  string name = 1;
  repeated string addresses = 2;
  string mac = 3;
}

message NetworkConnection {
  string local_addr = 1;
  string remote_addr = 2;
  string state = 3;
  int32 pid = 4;
  string protocol = 5;
}

message ScreenshotRequest {
  int32 display = 1;
}

message ScreenshotResponse {
  bytes data = 1;
  int32 width = 2;
  int32 height = 3;
}

message KillSwitchCheck {
  string engagement_id = 1;
  google.protobuf.Timestamp check_time = 2;
}

message KillSwitchStatus {
  bool active = 1;
  string reason = 2;
}
